name: bookleaf

services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - bookleaf_postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@database:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}?schema=public"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env.docker}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env.docker}"
      LLM_PROVIDER: "${LLM_PROVIDER:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_TIMEOUT_MS: "${LLM_TIMEOUT_MS:-5000}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-1}"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  bookleaf_postgres_data:
